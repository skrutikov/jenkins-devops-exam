{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fastapiapp.fullname" . }}-db
spec:
  selector:
    app: {{ include "fastapiapp.fullname" . }}-db
  ports:
    - port: {{ .Values.postgresql.port }}
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fastapiapp.fullname" . }}-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "fastapiapp.fullname" . }}-db
  template:
    metadata:
      labels:
        app: {{ include "fastapiapp.fullname" . }}-db
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgresql.image }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.username | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgresql.password | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.database | quote }}
{{- end }}

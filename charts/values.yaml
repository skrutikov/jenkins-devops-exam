# Default values for fastapiapp.

replicaCount: 1

image:
  # Overridden during deployment by values-movie.yaml or values-cast.yaml.
  repository: ""
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

# Docker Hub images are public, so no registry credentials are required.
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Environment variables are supplied by the service-specific values file.
env: []

# Health probes are disabled by default and enabled in each service-specific values file with the appropriate endpoint.
probe:
  enabled: false
  path: /
  # Wait 5 seconds after container startup before the first probe.
  initialDelaySeconds: 5
  # Run the probe every 10 seconds.
  periodSeconds: 10

# Minimal PostgreSQL instance used by each service release.
postgresql:
  enabled: false
  image: postgres:12.1-alpine
  port: 5432
  database: app_db
  username: app_user
  password: app_password

serviceAccount:
  create: true
  annotations: {}
  # When "create" is true, the name is generated from the chart's fullname template.
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

# Services are only accessed inside the Kubernetes cluster, so no external NodePort is required.
service:
  type: ClusterIP
  port: 80
  targetPort: 8000
  nodePort: null

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

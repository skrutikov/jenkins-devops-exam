# Default values for fastapiapp.

replicaCount: 1

image:
  repository: ""
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Environment variables for the concrete service.
env: []

# The supplied chart already contains health probes. The path is configurable
# because movie-service and cast-service expose different URLs.
probe:
  enabled: false
  path: /
  initialDelaySeconds: 5
  periodSeconds: 10

# Minimal PostgreSQL instance used by each service release.
postgresql:
  enabled: false
  image: postgres:12.1-alpine
  port: 5432
  database: app_db
  username: app_user
  password: app_password

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 8000
  nodePort: null

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

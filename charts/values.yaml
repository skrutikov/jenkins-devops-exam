# Default values for fastapiapp.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 3

image:
  repository: ""
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

# Set this when the registry requires authentication.
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# The provided application images do not define a Docker CMD,
# so the runtime command is configurable from Helm.
command:
  - uvicorn
  - app.main:app
  - --loop
  - asyncio
  - --host
  - 0.0.0.0
  - --port
  - "8000"

# Environment variables required by a concrete service can be supplied
# per Helm release, for example DATABASE_URI or CAST_SERVICE_HOST_URL.
env: []

# The movie and cast services expose different API paths, so probes are
# configurable per release instead of being hard-coded in the template.
probe:
  enabled: false
  path: /
  initialDelaySeconds: 5
  periodSeconds: 10


# Optional PostgreSQL instance for this Helm release.
# Enable it for the movie and cast releases so each service gets its own database.
postgresql:
  enabled: false
  image: postgres:12.1-alpine
  port: 5432
  database: app_db
  username: app_user
  password: app_password
  storage:
    enabled: true
    size: 1Gi

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# ClusterIP avoids fixed NodePort collisions when the same chart is reused
# for multiple services/environments. Set type/nodePort explicitly if needed.
service:
  type: ClusterIP
  port: 80
  targetPort: 8000
  nodePort: null

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Values for the cast-service Helm release.
# Use this file when installing or upgrading the "cast" release.
# Overrides selected defaults from values.yaml.

image:
  # Docker Hub repository.
  repository: seryonya/cast-service
  tag: "latest"

probe:
  # Enable Kubernetes readiness and liveness checks.
  # (Readiness failure stops traffic to the Pod; repeated liveness failures restart the container.)
  enabled: true
  # FastAPI endpoint checked directly on the Pod, e.g. <pod-ip>:8000/api/v1/casts/docs.
  path: /api/v1/casts/docs

postgresql:
  enabled: true
  database: cast_db
  username: cast_db_username
  password: cast_db_password

env:
  - name: DATABASE_URI
    value: postgresql://cast_db_username:cast_db_password@cast-fastapiapp-db:5432/cast_db
